     if(a.normal?.array)geo.setAttribute('normal',new THREE.Float32BufferAttribute(a.normal.array,3));
     else geo.computeVertexNormals();
     if(item.index?.array)geo.setIndex(item.index.array);
     const col=item.color?new THREE.Color().setRGB(...item.color):new THREE.Color(colors[colorIndex]);
     group.add(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:col,metalness:.1,roughness:.65,side:THREE.DoubleSide})));
   }return group
 }
 throw Error('Formato no compatible')
}
function fitDXF(){if(!mesh)return;const b=new THREE.Box3().setFromObject(mesh),c=b.getCenter(new THREE.Vector3()),sz=b.getSize(new THREE.Vector3());const span=Math.max(sz.x,sz.z,1);controls.target.copy(c);camera.up.set(0,0,-1);camera.position.copy(c).add(new THREE.Vector3(0,Math.max(10,span*1.8),.00001));camera.near=.001;camera.far=Math.max(1000,span*100);camera.updateProjectionMatrix();controls.update()}
async function load(file){
 if(!file)return;
 isDXF=/\.(dxf|svg)$/i.test(file.name);
 if(!/\.(stl|3mf|step|stp|dxf|svg)$/i.test(file.name)){toast('Selecciona STL, 3MF, STEP, STP, DXF o SVG');return}
 $('subtitle').textContent='Abriendo modelo…';
 try{
  const buffer=await file.arrayBuffer();
  const model=await convertFile(file,buffer);
  model.updateMatrixWorld(true);const originalBox=new THREE.Box3().setFromObject(model);
  if(originalBox.isEmpty())throw Error('El archivo no contiene geometría visible');
  const size=originalBox.getSize(new THREE.Vector3());
  // Los formatos CAD/impresión usan normalmente Z como eje vertical.
  // Convertimos Z hacia arriba en la escena y apoyamos la base sobre la placa.
  model.rotation.x=-Math.PI/2;
  model.updateMatrixWorld(true);
  const uprightBox=new THREE.Box3().setFromObject(model);
  const uprightCenter=uprightBox.getCenter(new THREE.Vector3());
  model.position.x-=uprightCenter.x;
  model.position.z-=uprightCenter.z;
  model.position.y-=uprightBox.min.y;
  model.updateMatrixWorld(true);
  if(mesh){scene.remove(mesh);mesh.traverse(o=>{o.geometry?.dispose();if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.dispose())}})}
  mesh=model;scene.add(mesh);modelSize=Math.max(size.x,size.y,size.z,1);makeGrid();
  const fmt=n=>n.toLocaleString('es-MX',{maximumFractionDigits:2})+' mm';
  $('x').textContent=fmt(size.x);$('y').textContent=fmt(size.y);$('z').textContent=fmt(size.z);
  $('filename').textContent=file.name;
  $('subtitle').textContent=file.name.split('.').pop().toUpperCase()+(file.name.toLowerCase().endsWith('.svg')?' · unidades del documento':' · unidades asumidas: mm');
  $('empty').style.display='none';sectionOn=false;$('sectionBtn').classList.remove('active');$('sectionBtn').textContent='Activar corte';$('sectionRange').disabled=true;$('sectionRange').value=100;clearMeasurement();updateBounds();if(isDXF){grid.visible=false;$('fitStatus').textContent=file.name.toLowerCase().endsWith('.svg')?'SVG · unidades según coordenadas del archivo':'DXF · unidades asumidas: mm';$('fitStatus').className='fitstatus';fitDXF();}else fit();toast(model.userData.dxfWarnings?.length?'DXF cargado parcialmente; algunas entidades no son compatibles':'Archivo cargado');
 }catch(e){console.error(e);toast('Error: '+e.message);$('subtitle').textContent='Error: '+e.message}
}

$('openBtn').onclick=()=>$('file').click();$('file').onchange=e=>{load(e.target.files[0]);e.target.value=''};
$('fitBtn').onclick=()=>isDXF?fitDXF():fit();$('resetBtn').onclick=()=>isDXF?fitDXF():fit();
function zoom(f){if(!mesh)return;const dir=camera.position.clone().sub(controls.target).multiplyScalar(f);camera.position.copy(controls.target).add(dir);controls.update()}
$('plusBtn').onclick=()=>zoom(.75);$('minusBtn').onclick=()=>zoom(1.35);
$('gridBtn').onclick=()=>{$('gridBtn').classList.toggle('active');grid.visible=!isDXF&&$('gridBtn').classList.contains('active')};
$('colorBtn').onclick=()=>{colorIndex=(colorIndex+1)%colors.length;if(mesh)mesh.traverse(o=>{if(o.isMesh&&o.material){for(const m of Array.isArray(o.material)?o.material:[o.material])m.color?.setHex(colors[colorIndex])}else if(o.isLine)o.material.color.setHex(colors[colorIndex])})};
// Herramientas avanzadas, aisladas del lector de archivos.
$('toolsBtn').onclick=()=>{$('tools').classList.toggle('show');$('toolsBtn').classList.toggle('active')};
document.querySelectorAll('[data-tab]').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b===btn));
 document.querySelectorAll('[data-page]').forEach(pg=>pg.classList.toggle('active',pg.dataset.page===btn.dataset.tab));
}));
function closeToolPanel(){$('tools').classList.remove('show');$('toolsBtn').classList.remove('active')}
document.querySelectorAll('[data-view], [data-rotate]').forEach(btn=>btn.addEventListener('click',()=>setTimeout(closeToolPanel,0)));
$('measureBtn').addEventListener('click',()=>setTimeout(closeToolPanel,0));

function bounds(){return mesh?new THREE.Box3().setFromObject(mesh):null}
function updateBounds(){if(!mesh)return;const b=bounds(),v=b.getSize(new THREE.Vector3()),fmt=n=>n.toLocaleString('es-MX',{maximumFractionDigits:2})+' mm';$('x').textContent=fmt(v.x);$('y').textContent=fmt(v.y);$('z').textContent=fmt(v.z);const ok=v.x<=180.0001&&v.y<=180.0001&&v.z<=180.0001;$('fitStatus').textContent=ok?'✓ Cabe en el volumen 180 × 180 × 180 mm':'⚠ Excede el volumen de impresión de la A1 Mini';$('fitStatus').className='fitstatus '+(ok?'good':'bad');updateSection()}
function settleOnBed(){if(!mesh)return;mesh.updateMatrixWorld(true);let b=bounds(),c=b.getCenter(new THREE.Vector3());mesh.position.x-=c.x;mesh.position.z-=c.z;mesh.position.y-=b.min.y;mesh.updateMatrixWorld(true);updateBounds()}
function look(direction){if(!mesh)return;const b=bounds(),c=b.getCenter(new THREE.Vector3()),radius=Math.max(b.getSize(new THREE.Vector3()).length(),220);controls.target.copy(c);camera.position.copy(c).addScaledVector(direction.clone().normalize(),radius*1.7);camera.up.set(0,1,0);if(Math.abs(direction.y)>.9)camera.up.set(0,0,-1);camera.lookAt(c);controls.update()}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{if(!mesh)return;const dirs={iso:new THREE.Vector3(1,1,1),top:new THREE.Vector3(0,1,.00001),front:new THREE.Vector3(0,.00001,1),side:new THREE.Vector3(1,.00001,0)};look(dirs[b.dataset.view])});
document.querySelectorAll('[data-rotate]').forEach(b=>b.onclick=()=>{if(!mesh)return;mesh.rotateOnWorldAxis(new THREE.Vector3(...({x:[1,0,0],y:[0,1,0],z:[0,0,1]})[b.dataset.rotate]),Math.PI/2);settleOnBed();clearMeasurement()});
$('orientReset').onclick=()=>{if(!mesh)return;mesh.rotation.set(-Math.PI/2,0,0);settleOnBed();clearMeasurement();fit()};
function allMeshes(){const a=[];mesh?.traverse(o=>{if(o.isMesh)a.push(o)});return a}
function updateSection(){if(!mesh)return;const b=bounds(),height=b.max.y-b.min.y,cut=b.min.y+height*Number($('sectionRange').value)/100;sectionPlane.constant=cut;for(const m of allMeshes()){const mats=Array.isArray(m.material)?m.material:[m.material];for(const mat of mats){mat.clippingPlanes=sectionOn?[sectionPlane]:[];mat.clipShadows=sectionOn;mat.needsUpdate=true}}$('sectionInfo').textContent=sectionOn?'Altura visible: '+(cut-b.min.y).toFixed(2)+' mm':'Corte desactivado'}
$('sectionBtn').onclick=()=>{if(!mesh)return;sectionOn=!sectionOn;$('sectionBtn').classList.toggle('active',sectionOn);$('sectionBtn').textContent=sectionOn?'Desactivar corte':'Activar corte';$('sectionRange').disabled=!sectionOn;updateSection()};
$('sectionRange').oninput=updateSection;
function clearMeasurement(){measurePoints=[];for(const marker of measureMarkers){scene.remove(marker);marker.geometry.dispose();marker.material.dispose()}measureMarkers=[];if(measureLine){scene.remove(measureLine);measureLine.geometry.dispose();measureLine.material.dispose();measureLine=null}$('measureInfo').textContent='Toca dos puntos sobre el modelo'}
$('clearMeasure').onclick=clearMeasurement;
$('measureBtn').onclick=()=>{measuring=!measuring;$('measureBtn').classList.toggle('active',measuring);$('measureBtn').textContent=measuring?'Terminar medición':'Medir';controls.enabled=!measuring;if(measuring)clearMeasurement()};
renderer.domElement.addEventListener('pointerup',e=>{if(!measuring||!mesh||e.pointerType==='touch'&&!e.isPrimary)return;const rect=renderer.domElement.getBoundingClientRect();pointer.set(((e.clientX-rect.left)/rect.width)*2-1,-((e.clientY-rect.top)/rect.height)*2+1);raycaster.setFromCamera(pointer,camera);raycaster.params.Line.threshold=Math.max(.3,modelSize*.006);const targets=[];mesh.traverse(o=>{if(o.isMesh||o.isLine)targets.push(o)});const hits=raycaster.intersectObjects(targets,false);if(!hits.length)return;if(measurePoints.length===2)clearMeasurement();const pt=hits[0].point.clone();measurePoints.push(pt);const r=Math.max(.5,modelSize*.008);const marker=new THREE.Mesh(new THREE.SphereGeometry(r,12,8),new THREE.MeshBasicMaterial({color:0xffb84c,depthTest:false}));marker.position.copy(pt);marker.renderOrder=10;scene.add(marker);measureMarkers.push(marker);if(measurePoints.length===2){const distance=measurePoints[0].distanceTo(measurePoints[1]);measureLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints(measurePoints),new THREE.LineBasicMaterial({color:0xffb84c,depthTest:false}));measureLine.renderOrder=10;scene.add(measureLine);$('measureInfo').textContent='Distancia: '+distance.toFixed(3)+' mm'}else $('measureInfo').textContent='Selecciona el segundo punto'});
$('shotBtn').onclick=()=>{if(!mesh){toast('Primero abre un modelo');return}renderer.render(scene,camera);renderer.domElement.toBlob(blob=>{if(!blob){toast('No se pudo crear la imagen');return}const f=new File([blob],'modelo-3d.png',{type:'image/png'});if(navigator.canShare?.({files:[f]})){navigator.share({files:[f]}).catch(()=>{})}else{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='modelo-3d.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}},'image/png')};
let drag=0;window.addEventListener('dragenter',e=>{e.preventDefault();drag++;$('drop').classList.add('show')});window.addEventListener('dragleave',e=>{e.preventDefault();drag=Math.max(0,drag-1);if(!drag)$('drop').classList.remove('show')});window.addEventListener('dragover',e=>e.preventDefault());window.addEventListener('drop',e=>{e.preventDefault();drag=0;$('drop').classList.remove('show');load(e.dataTransfer.files[0])});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script>
